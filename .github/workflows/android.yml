# Construit l'application Android (twin-picks.apk) et la publie dans les « Releases » du dépôt, à une adresse fixe :
#   https://github.com/<compte>/<dépôt>/releases/download/application/twin-picks.apk
# L'application elle-même change rarement : à chaque lancement, elle télécharge toute seule la dernière version du
# jeu (le code de la branche main). Elle n'est reconstruite que si le dossier android/ change (ou à la demande).
name: Application Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Tunnel Internet (cloudflared) pour le code de la partie
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/armeabi-v7a
          curl -fsSL -o android/app/src/main/jniLibs/arm64-v8a/libcloudflared.so https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64
          curl -fsSL -o android/app/src/main/jniLibs/armeabi-v7a/libcloudflared.so https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm
      - name: Construire l'APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Nommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk twin-picks.apk
      - name: Publier l'application
        uses: softprops/action-gh-release@v2
        with:
          tag_name: application
          name: Application Android Twin Picks
          body: |
            Sur le téléphone : téléchargez twin-picks.apk ci-dessous, ouvrez-le et autorisez l'installation.
            L'application se met à jour toute seule (elle télécharge la dernière version du jeu à chaque lancement).
          files: twin-picks.apk
          make_latest: true
